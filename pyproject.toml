[project]
name = "navigation"
version = "0.1.0"
description = "Completeness monitoring of search-navigation events in PySpark"
requires-python = ">=3.10"
dependencies = ["pyspark>=4.0,<5", "pandas<3", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
